version: '3.8'

services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: weiqi-game-server
    ports:
      - "9527:9527"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=9527
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9527', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1200M
        reservations:
          cpus: '1'
          memory: 256M
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
