<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋 - 多人对弈</title>
    <link rel="stylesheet" href="../../css/common.css">
</head>
<body>
    <div class="container">
        <h1>围棋</h1>
        <div class="game-room">
            <div class="game-board">
                <canvas id="board"></canvas>
            </div>
            <div class="game-panel">
                <div class="room-info-panel">
                    <h4>房间 #<span id="room-id">----</span></h4>
                    <div class="player-list" id="player-list"></div>
                </div>
                <div class="game-info">
                    <p>当前: <span id="current-player">等待开始</span></p>
                    <p>黑方提子: <span id="black-captures">0</span></p>
                    <p>白方提子: <span id="white-captures">0</span></p>
                </div>
                <div class="game-buttons">
                    <button id="ready-btn" class="btn-ready">准备</button>
                    <button id="pass-btn" class="btn-secondary" disabled>停一手</button>
                    <button id="settings-btn" class="btn-secondary">设置</button>
                    <button id="leave-btn" class="btn-leave">离开房间</button>
                </div>
                <!-- 设置面板 -->
                <div id="settings-panel" class="settings-panel hidden">
                    <h4>游戏设置</h4>
                    <div class="setting-item">
                        <label>AI难度:</label>
                        <select id="ai-difficulty">
                            <option value="easy">简单</option>
                            <option value="medium" selected>中等</option>
                            <option value="hard">困难</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label><input type="checkbox" id="show-qi"> 显示气</label>
                    </div>
                    <div class="setting-item">
                        <label><input type="checkbox" id="show-shi"> 显示势力</label>
                    </div>
                </div>
                <div class="chat-box">
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="输入消息...">
                        <button id="chat-send">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
